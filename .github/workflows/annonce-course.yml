# Annonces Discord :
#  - courses du soir : photo du cadre « Prochaine course » du site, 4 heures avant le départ
#    (ou à 17h si l'heure n'est pas renseignée dans CALENDRIER) ;
#  - nouveaux articles : photo du cadre de l'article et lien direct, dès qu'il est en ligne ;
#  - résultats : cadre « Résultats » (voiture, départ, arrivée de chaque pilote) dès qu'une soirée
#    apparaît dans RESULTATS LIGUE ;
#  - victoires : les victoires déclarées avec /victoire et validées sur Discord sont mises en ligne
#    (photo dans assets/victoires, données dans assets/victoires.json).
name: Annonces Discord (courses, articles, résultats, victoires)

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : poster tout de suite la prochaine course ou les derniers résultats"
        type: choice
        options: ['non', 'course', 'resultats']
        default: 'non'

permissions:
  contents: write

concurrency:
  group: annonce-course
  cancel-in-progress: false

jobs:
  annonce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Les courses déjà annoncées sont notées sur une branche à part (pour ne pas relancer le site)
      - name: Lire l'état des annonces
        run: |
          mkdir -p etat
          if git ls-remote --exit-code --heads origin etat-annonces >/dev/null; then
            git fetch -q origin etat-annonces
            git show origin/etat-annonces:annonces.json > etat/annonces.json || echo '{}' > etat/annonces.json
            git show origin/etat-annonces:articles.json > etat/articles.json 2>/dev/null || rm -f etat/articles.json
            git show origin/etat-annonces:resultats.json > etat/resultats.json 2>/dev/null || rm -f etat/resultats.json
          else
            echo '{}' > etat/annonces.json
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Y a-t-il une course à annoncer ?
        id: verif
        env:
          VERIF_SEUL: '1'
          ESSAI: ${{ inputs.essai || 'non' }}
          DISCORD_WEBHOOK_COURSES: ${{ secrets.DISCORD_WEBHOOK_COURSES }}
        run: |
          cd outils && npm init -y >/dev/null && npm i -s playwright@1.47.2 >/dev/null
          node annonce-course.mjs ../etat/annonces.json

      - name: Installer le navigateur
        if: steps.verif.outputs.a_faire == '1'
        run: cd outils && npx playwright install --with-deps chromium

      - name: Photographier et poster
        if: steps.verif.outputs.a_faire == '1'
        env:
          ESSAI: ${{ inputs.essai || 'non' }}
          DISCORD_WEBHOOK_COURSES: ${{ secrets.DISCORD_WEBHOOK_COURSES }}
        run: cd outils && node annonce-course.mjs ../etat/annonces.json

      - name: Enregistrer l'état
        if: (steps.verif.outputs.a_faire == '1' || steps.verif.outputs.etat_change == '1') && (inputs.essai || 'non') == 'non'
        run: |
          cp etat/annonces.json /tmp/annonces.json
          cp etat/articles.json /tmp/articles.json 2>/dev/null || true
          cp etat/resultats.json /tmp/resultats.json 2>/dev/null || true
          git config user.name "Meatball MC"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin etat-annonces >/dev/null; then
            git checkout -q -B etat-annonces origin/etat-annonces
          else
            git checkout -q --orphan etat-annonces && git rm -rqf .
          fi
          cp /tmp/annonces.json annonces.json
          for f in articles.json resultats.json; do if [ -f /tmp/$f ]; then cp /tmp/$f $f; fi; done
          git add annonces.json $(ls articles.json resultats.json 2>/dev/null)
          git commit -qm "Annonces postées" || exit 0
          git push -q origin etat-annonces

  victoires:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    env:
      RELAIS_CLE: ${{ secrets.RELAIS_CLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les victoires validées
        id: recup
        run: |
          if [ -z "$RELAIS_CLE" ]; then echo "Secret RELAIS_CLE absent"; exit 0; fi
          pip install -q pillow
          python3 outils/victoires.py recuperer
          if [ -n "$(git status --porcelain assets)" ]; then echo "nouveau=1" >> "$GITHUB_OUTPUT"; fi

      - name: Mettre en ligne
        if: steps.recup.outputs.nouveau == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Meatball MC"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -qm "Victoire validée sur Discord"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null || true

      - name: Marquer « En ligne » sur Discord
        if: env.RELAIS_CLE != ''
        run: python3 outils/victoires.py marquer
